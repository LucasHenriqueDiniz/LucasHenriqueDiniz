<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="415" height="100" viewBox="0 0 415 100">
<style>
  .t { font: 600 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3 }
  .s { font: 400 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e }
  .m { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950 }
  
  .it { opacity: 0; animation: car 9s infinite both }
  @keyframes car { 0% { opacity: 0; transform: translateY(6px) } 4%,30% { opacity: 1; transform: none } 34%,100% { opacity: 0; transform: translateY(-6px) } }
</style>
<rect x="0.5" y="0.5" width="414" height="99" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="14" y="22" class="t">04 · Carrossel CSS (3 itens no espaço de 1)</text>
<g class="it" style="animation-delay:0s">
  <rect x="14" y="38" width="48" height="48" rx="6" fill="#f78166"/>
  <text x="74" y="58" class="t">Kick Back</text><text x="74" y="76" class="s">Kenshi Yonezu</text>
  <text x="395" y="58" class="s" text-anchor="end">1/3</text></g>
<g class="it" style="animation-delay:3s">
  <rect x="14" y="38" width="48" height="48" rx="6" fill="#d2a8ff"/>
  <text x="74" y="58" class="t">Idol</text><text x="74" y="76" class="s">YOASOBI</text>
  <text x="395" y="58" class="s" text-anchor="end">2/3</text></g>
<g class="it" style="animation-delay:6s">
  <rect x="14" y="38" width="48" height="48" rx="6" fill="#58a6ff"/>
  <text x="74" y="58" class="t">Unravel</text><text x="74" y="76" class="s">TK from Ling tosite sigure</text>
  <text x="395" y="58" class="s" text-anchor="end">3/3</text></g>
</svg>
