<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="415" height="110" viewBox="0 0 415 110">
<style>
  .t { font: 600 13px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3 }
  .s { font: 400 11px -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e }
  .m { font: 400 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950 }
  
</style>
<rect x="0.5" y="0.5" width="414" height="109" rx="8" fill="#161b22" stroke="#30363d"/>
<text x="14" y="22" class="t">02 · SMIL (&lt;animate&gt;, animateTransform, animateMotion)</text>

<defs><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2"><animate attributeName="baseFrequency" values="0.02;0.06;0.02" dur="4s" repeatCount="indefinite"/></feTurbulence><feColorMatrix values="0 0 0 0 0.35  0 0 0 0 0.65  0 0 0 0 1  0 0 0 1.4 -0.3"/></filter></defs>
<circle cx="50" cy="68" r="10" fill="#f78166"><animate attributeName="r" values="8;18;8" dur="1.2s" repeatCount="indefinite"/></circle>
<rect x="100" y="52" width="32" height="32" rx="4" fill="#58a6ff"><animateTransform attributeName="transform" type="rotate" from="0 116 68" to="360 116 68" dur="2s" repeatCount="indefinite"/></rect>
<path id="p" d="M160 68 C 190 40, 230 96, 270 68" fill="none" stroke="#30363d" stroke-width="2"/>
<circle r="6" fill="#3fb950"><animateMotion dur="2s" repeatCount="indefinite" rotate="auto"><mpath xlink:href="#p"/></animateMotion></circle>
<rect x="295" y="44" width="105" height="50" rx="6" filter="url(#n)"/>
</svg>
